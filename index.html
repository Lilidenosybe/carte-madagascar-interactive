  <title>Carte interactive - Nord Madagascar (Test)</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #eef3f7;
    }
    #carte-container {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    button {
      position: absolute;
      top: 10px;
      padding: 8px 12px;
      font-size: 14px;
      margin-right: 8px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 10;
    }
    #toggle-mouillages {
      left: 10px;
      background: #ff9933;
      color: white;
    }
    #reset-view {
      right: 10px;
      background: #0077cc;
      color: white;
    }
    svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

          if (target) {
            g.addEventListener("mouseenter", () => {
              target.style.display = "inline";
            });
            g.addEventListener("mouseleave", () => {
              target.style.display = "none";
            });
          }
        }
      });

      const boutonMouillages = document.getElementById("toggle-mouillages");
      boutonMouillages.addEventListener("click", () => {
        const mouillages = document.getElementById("mouillages");
        if (mouillages) {
          const isHidden = mouillages.style.display === "none";
          mouillages.style.display = isHidden ? "inline" : "none";
        }
      });

      const boutonReset = document.getElementById("reset-view");
      boutonReset.addEventListener("click", () => {
        window.location.reload();
      });
    });
  </script>
</body>
</html>
